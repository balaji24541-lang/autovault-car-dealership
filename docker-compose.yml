services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dealership}
      POSTGRES_USER: ${POSTGRES_USER:-dealership}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-only}
    ports: ['5433:5432']
    volumes: ['postgres_data:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dealership']
      interval: 5s
      retries: 10
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-dealership}:${POSTGRES_PASSWORD:-local-dev-only}@db:5432/${POSTGRES_DB:-dealership}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env to at least 32 random bytes}
      CORS_ORIGINS: http://localhost:5173
    ports: ['8000:8000']
    depends_on:
      db:
        condition: service_healthy
  frontend:
    build: ./frontend
    ports: ['5173:5173']
    depends_on: [backend]
volumes:
  postgres_data:
